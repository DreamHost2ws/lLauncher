<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="48" viewBox="0 0 180 48" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>Lighting Launcher Logo</title>
  <defs>
    <!-- Modern drop shadow and glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Electric cyan-to-purple gradient -->
    <linearGradient id="bolt-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Translucent glass shield gradient -->
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(4, 4) scale(0.83)">
    <!-- Hexagon Shield -->
    <path d="M 24,3 L 43,14 L 43,34 L 24,45 L 5,34 L 5,14 Z" fill="url(#shield-gradient)" stroke="url(#bolt-gradient)" stroke-width="2" filter="url(#neon-glow)" />
    <!-- Sleek dark inner hexagon -->
    <path d="M 24,6 L 40,15 L 40,33 L 24,42 L 8,33 L 8,15 Z" fill="#0d0f13" opacity="0.6" />
    <!-- Glowing lightning bolt -->
    <path d="M 28,8 L 15,25 H 24 L 18,42 L 35,23 H 26 Z" fill="url(#bolt-gradient)" filter="url(#neon-glow)" />
    <!-- White highlight -->
    <path d="M 28,8 L 24.5,25 H 24 L 18,42 L 20,38 L 25.5,23 H 26 Z" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Right Text Brand for Light backgrounds -->
  <text x="52" y="30" font-family="'Inter', 'Segoe UI', 'Outfit', sans-serif" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="0.5">Lighting <tspan fill="#7000ff">Launcher</tspan></text>
</svg>
